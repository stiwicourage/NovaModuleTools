$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: NovaModuleTools
  structure:
    - type: section
      key: section-start
      title: Start here
      description: Choose the documentation path that matches your task.
      path: start
      default: true
      children:
        - type: space
          key: space-overview
          title: Overview
          path: overview
          default: true
          content:
            directory: ./docs/gitbook/overview
            language: en
    - type: section
      key: section-reference
      title: Reference
      description: Generated PowerShell module and cmdlet help.
      path: reference
      children:
        - type: space
          key: space-powershell-command-reference
          title: PowerShell Command Reference
          path: powershell
          default: true
          content:
            directory: ./docs/NovaModuleTools/en-US
            language: en
    - type: section-group
      key: section-group-resources
      title: Resources
      children:
        - type: external-link
          key: link-user-guides
          title: User guides
          description: Installation, workflows, configuration guidance, and troubleshooting.
          url: https://www.novamoduletools.com/
        - type: external-link
          key: link-release-notes
          title: Release notes
          description: Public workflow, configuration, and upgrade-impacting changes.
          url: https://www.novamoduletools.com/release-notes.html
        - type: external-link
          key: link-github
          title: GitHub repository
          description: Source code, issues, and contribution information.
          url: https://github.com/stiwicourage/NovaModuleTools
        - type: external-link
          key: link-security
          title: Security policy
          description: Supported versions and private vulnerability reporting.
          url: https://github.com/stiwicourage/NovaModuleTools/security/policy
