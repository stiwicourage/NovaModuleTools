version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      powershell-ci:
        patterns:
          - "stiwicourage/powershell-ci*"
    cooldown:
      exclude:
        - "stiwicourage/powershell-ci*"
