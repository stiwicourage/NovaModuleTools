name: Publish Module

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  Publish:
    if: >-
      ${{
        github.event_name != 'push' ||
        !startsWith(github.event.head_commit.message || '', 'chore(release): ')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required modules from PSGallery
        run: ./scripts/build/ci/Install-CiPowerShellModules.ps1

      - name: Build Module
        run: Invoke-NovaBuild -ContinuousIntegration

      - name: Run Pester Tests
        run: Test-NovaBuild

      - name: Generate Report
        continue-on-error: true
        run: |
          $reportLines = @('## Output Files', '')
          $files = Get-ChildItem -Path ./dist -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName

          if ($files) {
            $reportLines += '| Name | Directory |'
            $reportLines += '| --- | --- |'
            $reportLines += $files | ForEach-Object {
              $name = ('' + $_.Name).Replace('|', '\|')
              $directory = ('' + $_.Directory).Replace('|', '\|')
              "| $name | $directory |"
            }
          }
          else {
            $reportLines += 'No files found in `./dist`.'
          }

          $report = $reportLines -join [Environment]::NewLine
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $report
          Write-Output $report

      - name: Ensure PSGallery repository registration
        if: github.ref_name == 'main'
        uses: ./.github/actions/ensure-psresource-repository

      - name: Run release with NovaRelease
        id: semantic_release
        if: github.ref_name == 'main'
        run: |
          Invoke-NovaRelease -Repository PSGallery -ApiKey $env:PSGALLERY_API -SkipTests
          $version = Get-NovaProjectInfo -Version
          $result = Move-UnreleasedChangelog -Version $version
          Move-UnreleasedChangelog -Path ./RELEASE_NOTE.md -Version $version | Out-Null

          "release_version=$version" >> $env:GITHUB_OUTPUT

          $delimiter = [guid]::NewGuid().Guid
          "tag_message<<$delimiter" >> $env:GITHUB_OUTPUT
          $result.TagMessageText >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT
        env:
          PSGALLERY_API: ${{ secrets.PSGALLERY_API }}

      - name: Create verified release commit
        id: commit_release
        if: github.ref_name == 'main'
        uses: ./.github/actions/create-verified-commit
        with:
          base-ref: main
          commit-message: 'chore(release): ${{ steps.semantic_release.outputs.release_version }}'

      - name: Push verified release commit
        if: github.ref_name == 'main' && steps.commit_release.outputs.has-changes == 'true'
        uses: ./.github/actions/update-git-ref
        with:
          ref: refs/heads/main
          sha: ${{ steps.commit_release.outputs.commit-sha }}

      - name: Create annotated release tag
        if: github.ref_name == 'main' && steps.commit_release.outputs.has-changes == 'true'
        uses: ./.github/actions/create-annotated-tag
        with:
          tag-name: ${{ steps.semantic_release.outputs.release_version }}
          target-sha: ${{ steps.commit_release.outputs.commit-sha }}
          message: ${{ steps.semantic_release.outputs.tag_message }}

      - name: Prepare next prerelease version on main -> develop
        if: github.ref_name == 'main' && steps.commit_release.outputs.has-changes == 'true'
        run: |
          git fetch origin main
          git fetch origin develop

          git checkout develop
          git reset --hard origin/main

          Update-NovaModuleVersion -Preview -ContinuousIntegration

      - name: Create verified develop prerelease commit
        id: commit_develop_from_main
        if: github.ref_name == 'main' && steps.commit_release.outputs.has-changes == 'true'
        uses: ./.github/actions/create-verified-commit
        with:
          base-ref: main
          commit-message: 'chore: prepare develop for next prerelease'

      - name: Push verified develop prerelease commit
        if: github.ref_name == 'main' && steps.commit_develop_from_main.outputs.has-changes == 'true'
        uses: ./.github/actions/update-git-ref
        with:
          ref: refs/heads/develop
          sha: ${{ steps.commit_develop_from_main.outputs.commit-sha }}
          force: 'true'

      - name: Prepare next prerelease version on develop
        if: github.ref_name == 'develop'
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch origin develop
          git checkout develop

      - name: Ensure PSGallery repository registration
        if: github.ref_name == 'develop'
        uses: ./.github/actions/ensure-psresource-repository

      - name: Publish develop prerelease to PSGallery
        if: github.ref_name == 'develop'
        run: |
          Publish-NovaModule -Repository PSGallery -ApiKey $env:PSGALLERY_API -SkipTests -ContinuousIntegration
        env:
          PSGALLERY_API: ${{ secrets.PSGALLERY_API }}

      - name: Bump next prerelease version on develop
        if: github.ref_name == 'develop'
        run: |
          Update-NovaModuleVersion -Preview -ContinuousIntegration

      - name: Create verified develop commit
        id: commit_develop
        if: github.ref_name == 'develop'
        uses: ./.github/actions/create-verified-commit
        with:
          base-ref: develop
          commit-message: 'chore: prepare next prerelease version'

      - name: Push verified develop commit
        if: github.ref_name == 'develop' && steps.commit_develop.outputs.has-changes == 'true'
        uses: ./.github/actions/update-git-ref
        with:
          ref: refs/heads/develop
          sha: ${{ steps.commit_develop.outputs.commit-sha }}
