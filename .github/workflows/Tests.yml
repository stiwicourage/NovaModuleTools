name: Run Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    uses: stiwicourage/powershell-ci/.github/workflows/tests.yml@0.5.0
    with:
      test-isolation: process
      changelog-files: ./CHANGELOG.md ./RELEASE_NOTE.md
      script-analyzer-paths: src scripts run.ps1
      script-analyzer-severity: Error Warning ParseError
      script-analyzer-required-version: '1.25.0'
      artifact-name: nova-ci-artifacts
    secrets: inherit
